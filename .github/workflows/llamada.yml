name: Llamada diaria Telegram

on:
  workflow_dispatch:   # Ejecutado exclusivamente por cron-job.org a las 7:56 PM Colombia

jobs:
  abrir-llamada:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon py-tgcalls pillow reportlab
      - name: Preparar dependencias de audio y enlaces para PyTgCalls
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          rm -f ./ffmpeg ./ffprobe
          ln -sf $(which ffmpeg) ./ffmpeg
          ln -sf $(which ffprobe) ./ffprobe
          chmod +x ./ffmpeg ./ffprobe
          echo "FFmpeg instalado y enlazado: $(which ffmpeg) -> ./ffmpeg"
      - run: python -u llamada.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_GROUP: ${{ secrets.TG_GROUP }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AVISO: |
            📞 ¡Empieza la llamada diaria!
            🕗 7:56 pm Colombia | {CA} San José, California

            Antes de entrar:
            🔋 Celular con buena carga.
            📶 Buena señal (Wi-Fi o datos) y sin cambiar de red durante la llamada.
            ⚙️ Android: pon Telegram en "Sin restricciones" en Batería y fíjalo en recientes (candado).
            🔁 Si se cae seguido: Ajustes > Privacidad y seguridad > Llamadas > Peer-to-peer > "Nunca".
            🔄 Mantén Telegram actualizado.
            💻 PC: desactiva el ahorro de energía de la tarjeta de red.

            Cada uno es responsable de su conexión y su dispositivo: las caídas casi siempre vienen del lado local, no de Telegram.

      - name: Guardar registro histórico de puntos y asistencias
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar registro de asistencias y puntos [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Reintentando push ($i)..."
              sleep 3
            done
          fi
