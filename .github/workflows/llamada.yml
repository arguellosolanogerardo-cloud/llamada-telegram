name: Llamada diaria Telegram

on:
  schedule:
    # 8:05 pm Colombia (UTC-5) = 01:05 UTC del día siguiente (se ajustan minutos a :05 para evitar saturación de GitHub en la hora en punto :00)
    - cron: "5 1 * * *"
  workflow_dispatch:   # permite probarlo manualmente desde la pestaña Actions

jobs:
  abrir-llamada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon
      - run: python llamada.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_GROUP: ${{ secrets.TG_GROUP }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          AVISO: |
            📞 ¡Empieza la llamada diaria!
            🕗 8:00 pm Colombia | {CA} San José, California

            Antes de entrar:
            🔋 Celular con buena carga.
            📶 Buena señal (Wi-Fi o datos) y sin cambiar de red durante la llamada.
            ⚙️ Android: pon Telegram en "Sin restricciones" en Batería y fíjalo en recientes (candado).
            🔁 Si se cae seguido: Ajustes > Privacidad y seguridad > Llamadas > Peer-to-peer > "Nunca".
            🔄 Mantén Telegram actualizado.
            💻 PC: desactiva el ahorro de energía de la tarjeta de red.

            Cada uno es responsable de su conexión y su dispositivo: las caídas casi siempre vienen del lado local, no de Telegram.
