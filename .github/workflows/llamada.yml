name: Llamada diaria Telegram

on:
  workflow_dispatch:
    inputs:
      grupo:
        description: 'ID numérico o @username del grupo (deja vacío para usar grupo oficial)'
        required: false
        default: ''
        type: string
      titulo:
        description: 'Título de la sala de voz'
        required: false
        default: 'VIDEOLLAMADA GRUPO LA VERDAD OS HARA LIBRES.'
        type: string
      modo_diagnostico:
        description: 'Solo verificar sesión y permisos sin tocar la sala (true/false)'
        required: false
        default: 'false'
        type: string
  push:
    branches:
      - main
    paths:
      - 'llamada.py'
      - '.github/workflows/llamada.yml'

concurrency:
  group: ${{ github.event_name == 'push' && 'diagnostico-llamada' || 'llamada-telegram' }}
  cancel-in-progress: true

jobs:
  abrir-llamada:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon py-tgcalls pillow reportlab edge-tts requests
      - name: Preparar dependencias de audio y enlaces para PyTgCalls
        run: |
          if ! which ffmpeg >/dev/null 2>&1 || ! which ffprobe >/dev/null 2>&1; then
            echo "Descargando FFmpeg estático desde GitHub Releases CDN..."
            mkdir -p /tmp/ff_pkg
            curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp/ff_pkg || true
            FF_SRC=$(find /tmp/ff_pkg -name ffmpeg -type f | head -n 1)
            if [ -n "$FF_SRC" ]; then
              FF_DIR=$(dirname "$FF_SRC")
              sudo cp "$FF_DIR/ffmpeg" "$FF_DIR/ffprobe" /usr/local/bin/
              sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
            else
              echo "Fallback: apt-get minimal..."
              sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
            fi
          fi
          rm -f ./ffmpeg ./ffprobe
          ln -sf $(which ffmpeg) ./ffmpeg
          ln -sf $(which ffprobe) ./ffprobe
          echo "FFmpeg instalado y enlazado: $(which ffmpeg) -> ./ffmpeg"
      - name: Ejecutar monitor y apertura de sala (con reintento ante fallos de arranque)
        run: |
          if [ "$MODO_DIAGNOSTICO" = "true" ]; then
            echo "🔍 Ejecutando verificación de diagnóstico de sesión (--check-only)..."
            python -u llamada.py --check-only
            exit $?
          fi
          MAX_INTENTOS=3
          for intento in $(seq 1 $MAX_INTENTOS); do
            echo "=========================================="
            echo "🚀 Iniciando llamada.py (Intento $intento/$MAX_INTENTOS)..."
            echo "=========================================="
            START_TS=$(date +%s)
            set +e
            python -u llamada.py
            EXIT_CODE=$?
            set -e
            END_TS=$(date +%s)
            ELAPSED=$((END_TS - START_TS))
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ llamada.py finalizó correctamente (código 0 tras ${ELAPSED}s)."
              exit 0
            fi
            echo "⚠️ llamada.py terminó con código de error $EXIT_CODE tras ${ELAPSED}s."
            if [ $ELAPSED -ge 1200 ]; then
              echo "ℹ️ La llamada ya había estado activa durante ${ELAPSED}s. No se reinicia desde cero."
              exit 0
            fi
            if [ $intento -lt $MAX_INTENTOS ]; then
              ESPERA=$((intento * 6))
              echo "⏳ Reintentando en ${ESPERA} segundos..."
              sleep $ESPERA
            else
              echo "🚨 Fallaron los $MAX_INTENTOS intentos de arranque."
              exit $EXIT_CODE
            fi
          done
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_GROUP: ${{ inputs.grupo != '' && inputs.grupo || secrets.TG_GROUP }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.grupo != '' && inputs.grupo || secrets.CHAT_ID }}
          CALL_TITLE: ${{ inputs.titulo != '' && inputs.titulo || 'VIDEOLLAMADA GRUPO LA VERDAD OS HARA LIBRES.' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODO_DIAGNOSTICO: ${{ github.event_name == 'push' && 'true' || inputs.modo_diagnostico || 'false' }}
          AVISO: |
            📞 ¡Empieza la llamada diaria!
            🕗 7:56 pm Colombia | {CA} San José, California

            Antes de entrar:
            🔋 Celular con buena carga.
            📶 Buena señal (Wi-Fi o datos) y sin cambiar de red durante la llamada.
            ⚙️ Android: pon Telegram en "Sin restricciones" en Batería y fíjalo en recientes (candado).
            🔁 Si se cae seguido: Ajustes > Privacidad y seguridad > Llamadas > Peer-to-peer > "Nunca".
            🔄 Mantén Telegram actualizado.
            💻 PC: desactiva el ahorro de energía de la tarjeta de red.

            Cada uno es responsable de su conexión y su dispositivo: las caídas casi siempre vienen del lado local, no de Telegram.

      - name: Guardar registro histórico de puntos y asistencias
        if: always() && github.event_name != 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar registro de asistencias y puntos [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash -X theirs origin main && git push && break
              echo "Reintentando push ($i)..."
              sleep 3
            done
          fi
