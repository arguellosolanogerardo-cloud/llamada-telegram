name: Limpieza periódica Telegram

on:
  schedule:
    # Cada 3 días a las 3:15 am Colombia (UTC-5) = 08:15 UTC
    - cron: "15 8 */3 * *"
  workflow_dispatch:
    inputs:
      modo_profundo:
        description: "Revisar la totalidad del historial (true) o solo los ultimos 4 dias (false)"
        required: true
        default: true
        type: boolean

jobs:
  limpieza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon
      - name: Ejecutar script de limpieza
        run: python limpieza.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_GROUP: ${{ secrets.TG_GROUP }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Si se dispara manualmente con modo_profundo=true -> 0 (todo el historial). Si es por schedule -> 4 días.
          DIAS_HISTORIAL: ${{ github.event_name == 'workflow_dispatch' && (inputs.modo_profundo && '0' || '4') || '4' }}
